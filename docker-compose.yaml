version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: games

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    develop:
      watch:
        - action: sync
          path: ./backend/app
          target: /app/app
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+psycopg://

    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend/my-app
      dockerfile: DockerFile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    develop:
        watch:
          - action: sync
            path: ./frontend/my-app/src/app
            target: /app/src/app
    restart: unless-stopped

    depends_on:
      - backend

    environment:
      API_URL: http://backend:8000

    ports:
      - "3000:3000"

volumes:
  postgres_data:
